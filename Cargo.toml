[package]
name = "saga-server"
version = "1.0.0"
edition = "2021"
rust-version = "1.94"
publish = false
autotests = false
description = "Standalone NASA Saga orchestrator: register workflows without server restarts, with multi-registry discovery and durable recovery"
keywords = ["saga", "orchestration", "dynamic-workflows", "service-discovery", "durable-recovery"]
categories = ["network-programming", "database"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nasa-runtime/saga-server"
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/zcf/**", "/docker/**", "/examples/**", "/docs/**", "/README*.md", "/LICENSE-*", "/SECURITY.md", "/CONTRIBUTING.md"]

[dependencies]
anyhow = "1"
nasa = { version = "2.0.5", default-features = false, features = ["application", "log", "yml", "web", "grafana", "saga-runtime", "saga-runtime-pgsql", "discovery-nacos", "discovery-consul", "discovery-kubernetes"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
