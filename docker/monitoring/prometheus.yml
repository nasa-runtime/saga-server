global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: saga-application
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: [saga-server:9464]
  - job_name: saga-state
    metrics_path: /_nasa/saga/metrics
    scrape_timeout: 5s
    static_configs:
      - targets: [saga-server:2070]
        labels:
          service_name: saga-server
          deployment_environment: local
          cluster: local
