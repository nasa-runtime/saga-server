services:
  saga-server:
    image: ${SAGA_IMAGE:-nasaruntime/saga-server:1.0.0}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 70s
    # 凭据按原文注入，使 $、引号等内容与 docker run --env-file 的语义一致。
    env_file:
      - path: ./.env
        format: raw
    ports:
      - "127.0.0.1:2070:2070"
    volumes:
      # 只导入业务配置，避免把同目录的 Compose 文件和凭据文件挂入应用。
      - type: bind
        source: ./application.yml
        target: /etc/saga-server/application.yml
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
